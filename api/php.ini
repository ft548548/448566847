; Vercel 函数级 PHP 配置（vercel-php 运行时会读取本文件，构建期该文件被移除）
; 注意：平台层面限制请求体 4.5MB，这里不要写成 1024M，否则前端仍会在 413 处失败。

memory_limit = 512M
upload_max_filesize = 4M
post_max_size = 5M
max_execution_time = 60
max_input_time = 60

; 生产环境不要向响应体吐堆栈
display_errors = Off
log_errors = On

; Laravel 8 在 PHP 8 上会打出大量废弃告警，收敛到 E_ALL & ~E_DEPRECATED
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
