// 警务实训平台 —— DooTask 独立站点
// 监听 8080，与 80 端口上的既有站点（/yj 考试平台）完全隔离
// 安装位置：/etc/nginx/conf.d/dootask.conf（或宝塔 vhost 目录）
// 占位符 __PHP_SOCK__ 由部署脚本按实际 php-fpm 监听方式替换

server {
    listen       8080;
    server_name  _;

    root   /www/wwwroot/dootask/public;
    index  index.php index.html;

    charset utf-8;
    client_max_body_size 200m;
    client_body_timeout  300s;

    # 禁止访问隐藏文件（.env / .git 等）
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 上传目录内禁止执行 PHP，防止上传木马
    location ~* ^/(uploads|storage)/.*\.(php|php5|phtml|pht)$ {
        deny all;
    }

    # 前端路由与 API 统一交给 Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass   __PHP_SOCK__;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 静态资源：长缓存（文件名带版本时安全）
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|eot|map)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    access_log /var/log/nginx/dootask.access.log;
    error_log  /var/log/nginx/dootask.error.log warn;
}
